<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>+500</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0a0b14;
    --asphalt:#181a2b;
    --neon:#ff2e88;
    --money:#3dff8b;
    --sodium:#ffb347;
    --cold:#7d8bb0;
    --paper:#e8e9f3;
    --display:'Anton', 'Arial Narrow', Impact, sans-serif;
    --body:'IBM Plex Sans', system-ui, -apple-system, Segoe UI, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#05050a;color:var(--paper);font-family:var(--body);overflow:hidden}
  #fit{position:fixed;inset:0;display:grid;place-items:center}
  #stage{
    position:relative;width:960px;height:600px;transform-origin:center center;
    background:var(--night);overflow:hidden;box-shadow:0 0 0 1px #20223a, 0 30px 80px rgba(0,0,0,.8);
  }
  canvas{position:absolute;inset:0;width:960px;height:600px;display:block;image-rendering:auto}

  /* ---------- HUD ---------- */
  #hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
  #hud.on{opacity:1}
  #hud.glitch{animation:glitch .5s steps(2) 6}
  @keyframes glitch{
    0%{transform:translate(0,0);filter:none}
    25%{transform:translate(-6px,2px);filter:hue-rotate(80deg)}
    50%{transform:translate(5px,-3px)}
    75%{transform:translate(-3px,-1px);filter:saturate(3)}
    100%{transform:translate(0,0)}
  }
  .stats{position:absolute;top:18px;right:20px;text-align:right;line-height:1}
  .cash{font-family:var(--display);font-size:38px;color:var(--money);letter-spacing:.5px;transform-origin:right center;transition:transform .25s;
        text-shadow:0 0 18px rgba(61,255,139,.45)}
  .sub{margin-top:8px;font-size:13px;letter-spacing:.18em;color:#b9c0dd}
  .sub b{font-family:var(--display);font-weight:400;font-size:17px;color:#fff;letter-spacing:0;margin-left:4px}
  .repbar{margin-top:8px;width:150px;height:5px;background:#252842;margin-left:auto;overflow:hidden}
  .repbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--sodium),var(--neon));transition:width .5s}

  /* objective */
  #objective{position:absolute;top:18px;left:20px;max-width:330px}
  #objective .tag{font-size:11px;letter-spacing:.3em;color:var(--neon)}
  #objective .txt{font-family:var(--display);font-size:24px;line-height:1.05;margin-top:6px;letter-spacing:.5px}

  /* mission banner */
  #banner{position:absolute;left:0;right:0;top:170px;text-align:center;opacity:0;pointer-events:none}
  #banner.show{animation:bannerIn 2.6s ease-out forwards}
  #banner .k{font-size:12px;letter-spacing:.45em;color:var(--sodium)}
  #banner .v{font-family:var(--display);font-size:64px;line-height:.95;margin-top:4px;
             text-shadow:0 6px 0 rgba(255,46,136,.35)}
  @keyframes bannerIn{
    0%{opacity:0;transform:scale(1.25) translateY(10px);filter:blur(6px)}
    12%{opacity:1;transform:scale(1);filter:blur(0)}
    75%{opacity:1}
    100%{opacity:0;transform:translateY(-14px)}
  }

  /* reward pops */
  #pops{position:absolute;right:26px;top:120px;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .pop{font-family:var(--display);font-size:40px;color:var(--money);animation:pop 1.5s ease-out forwards;
       text-shadow:0 0 24px rgba(61,255,139,.6)}
  .pop.xp{color:var(--sodium);font-size:30px;text-shadow:0 0 20px rgba(255,179,71,.5)}
  .pop.rep{color:var(--neon);font-size:26px;text-shadow:0 0 20px rgba(255,46,136,.5)}
  .pop.mute{color:#6a7194;text-shadow:none}
  @keyframes pop{
    0%{opacity:0;transform:translateY(16px) scale(.7)}
    18%{opacity:1;transform:translateY(0) scale(1.1)}
    30%{transform:scale(1)}
    100%{opacity:0;transform:translateY(-34px)}
  }

  /* prompt */
  #prompt{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);opacity:0;transition:opacity .18s;
          font-size:14px;color:#dfe3f5;background:rgba(10,11,20,.72);border:1px solid #2c3050;
          padding:7px 14px;white-space:nowrap}
  #prompt.on{opacity:1;animation:promptPulse 1.6s ease-in-out infinite}
  @keyframes promptPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.045)}}
  #prompt kbd{font-family:var(--display);background:var(--paper);color:#0a0b14;padding:1px 8px;margin-right:8px;font-size:15px}

  /* dialogue */
  #dialogue{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:640px;opacity:0;
            transition:opacity .25s;pointer-events:none}
  #dialogue.on{opacity:1}
  #dialogue .who{font-size:11px;letter-spacing:.3em;color:var(--sodium);margin-bottom:6px}
  #dialogue .line{font-size:19px;line-height:1.45;background:rgba(8,9,17,.86);border-left:3px solid var(--neon);
                  padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #dialogue.quiet .line{border-left-color:#4b5477;background:rgba(8,9,17,.9);color:#c3c9e4;font-style:italic}
  #dialogue .cont{margin-top:6px;font-size:11px;color:#6f77a0;text-align:right;letter-spacing:.2em}

  /* full screen overlays */
  .overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
           background:rgba(4,4,9,.94);padding:40px;text-align:center}
  .overlay.on{display:flex}
  .overlay h1{font-family:var(--display);font-size:120px;margin:0;line-height:.85;letter-spacing:2px}
  .overlay h2{font-family:var(--display);font-size:40px;margin:0 0 6px;line-height:1}
  .overlay p{max-width:560px;font-size:17px;line-height:1.55;color:#c6cbe6}

  /* title */
  #title h1{color:#fff;text-shadow:0 0 60px rgba(255,46,136,.5)}
  #title .tagline{margin-top:14px;font-size:20px;color:var(--money);letter-spacing:.02em}
  #title .keys{margin-top:30px;font-size:13px;color:#7a81a8;line-height:2}
  #title .keys kbd{font-family:var(--display);background:#1b1d30;border:1px solid #333758;padding:2px 9px;margin:0 3px}
  .btn{pointer-events:auto;cursor:pointer;font-family:var(--display);font-size:22px;letter-spacing:1px;
       background:var(--paper);color:#0a0b14;border:0;padding:12px 28px;margin-top:26px}
  .btn:hover{background:var(--money)}
  .btn:focus-visible{outline:3px solid var(--sodium);outline-offset:3px}

  /* flashback */
  #flash{background:#000}
  #flash .frame{font-family:var(--display);font-size:72px;line-height:.95}
  #flash .money{color:var(--money);font-size:96px}
  #flash .name{font-family:var(--body);font-size:22px;color:#fff;margin-top:14px;font-style:italic}

  /* consequence ledger */
  #ledger{background:rgba(4,4,9,.97);justify-content:center}
  #ledger .head{font-size:12px;letter-spacing:.4em;color:var(--neon);margin-bottom:22px}
  #ledger table{border-collapse:collapse;width:660px;font-size:16px}
  #ledger td{padding:14px 10px;border-bottom:1px solid #22253d;text-align:left;vertical-align:top}
  #ledger td.a{width:44%;color:#8d94ba;text-decoration:line-through}
  #ledger td.b{color:#fff}
  #ledger tr{opacity:0;animation:rowIn .5s ease-out forwards}
  @keyframes rowIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
  #ledger .line{margin-top:30px;font-size:21px;color:var(--paper);max-width:620px;line-height:1.5}

  /* choices */
  #choices{position:absolute;left:0;right:0;bottom:44px;display:none;justify-content:center;gap:14px;z-index:5}
  #choices.on{display:flex}
  .choice{cursor:pointer;font-family:var(--display);font-size:20px;letter-spacing:.06em;background:rgba(10,11,20,.9);
          color:var(--paper);border:1px solid #3a3f66;padding:14px 22px;min-width:150px}
  .choice:hover{border-color:var(--paper);background:var(--paper);color:#0a0b14}
  .choice:focus-visible{outline:3px solid var(--sodium);outline-offset:2px}
  .choice small{display:block;font-family:var(--body);font-size:11px;letter-spacing:.12em;color:#8089b2;margin-top:5px}
  .choice:hover small{color:#454b6e}

  /* act card */
  #act{background:#05050a}
  #act .num{font-family:var(--display);font-size:22px;color:var(--neon);letter-spacing:.4em}
  #act .nm{font-family:var(--display);font-size:78px;margin-top:6px;line-height:.9}

  #fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
  #vig{position:absolute;inset:0;pointer-events:none;
       background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.65) 100%)}
  #hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:11px;color:#3e4262;letter-spacing:.12em}
  @media (prefers-reduced-motion: reduce){
    #banner.show,.pop,#hud.glitch{animation-duration:.01ms;animation-iteration-count:1}
  }
</style>
</head>
<body>
<div id="fit">
  <div id="stage">
    <canvas id="c" width="960" height="600"></canvas>
    <div id="vig"></div>

    <div id="hud">
      <div class="stats">
        <div class="cash" id="cash">$0</div>
        <div class="sub">XP<b id="xp">0</b></div>
        <div class="sub">REP<b id="repn">0</b></div>
        <div class="repbar"><i id="repbar"></i></div>
      </div>
      <div id="objective"><div class="tag" id="objtag">OBJECTIVE</div><div class="txt" id="objtxt"></div></div>
      <div id="pops"></div>
    </div>

    <div id="banner"><div class="k" id="bk"></div><div class="v" id="bv"></div></div>
    <div id="prompt"><kbd>E</kbd><span id="promptText"></span></div>

    <div id="dialogue"><div class="who" id="dwho"></div><div class="line" id="dline"></div><div class="cont">E</div></div>

    <div id="choices"></div>

    <div class="overlay on" id="title">
      <h1>+500</h1>
      <div class="tagline">Make money. Build reputation. Do whatever it takes.</div>
      <button class="btn" id="startBtn">Start the job</button>
      <div class="keys">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move &nbsp;·&nbsp; <kbd>Shift</kbd> sprint &nbsp;·&nbsp; <kbd>E</kbd> interact / continue<br>
        Presenter keys: <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> jump to act &nbsp;·&nbsp; <kbd>R</kbd> restart
      </div>
    </div>

    <div class="overlay" id="act"><div class="num" id="actnum"></div><div class="nm" id="actname"></div></div>
    <div class="overlay" id="flash"><div class="frame" id="flashframe"></div><div class="name" id="flashname"></div></div>
    <div class="overlay" id="ledger">
      <div class="head">WHAT THE NUMBERS WERE COUNTING</div>
      <table id="ledgerTable"></table>
      <div class="line" id="ledgerLine"></div>
    </div>
    <div class="overlay" id="endcard">
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <button class="btn" id="againBtn">Play again</button>
    </div>

    <div id="fade"></div>
  </div>
</div>
<div id="hint">+500 — hackathon prototype</div>

<script>
"use strict";
/* ============================================================
   +500 — a narrative crime prototype
   Act I teaches you the reward language. Act II connects it to
   people. Act III makes you keep playing in the city you changed.
   ============================================================ */

/* ---------- scaling ---------- */
const stage = document.getElementById('stage');
function fit(){
  const s = Math.min(window.innerWidth/960, window.innerHeight/600);
  stage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const VW = 960, VH = 600;
const WORLD = {w:1900, h:1300};

/* ---------- state ---------- */
const S = {
  phase:'title',          // title | play | cine | end
  act:1,
  busy:false,
  money:0, xp:0, rep:0,
  flags:{ robbedStore:false, npcInjured:false, carStolen:false, policeAttention:0, finalChoice:null, walkedAway:false },
  seen:{ store:false, fight:false, car:false },
  mission:0,
  objective:'',
  objTag:'OBJECTIVE',
  driving:false,
  chase:false,
  rain:0,          // 0..1
  dark:0,          // 0..1 global cool darkening
  shake:0,
  time:0,
  timeScale:1,     // brief slow-motion on impact beats
  focus:null,      // {x,y} camera focus during an interaction
  sprint:0,        // 0..1 sprint blend, drives fov + trail
  flash:0,         // white/green screen pop on a payout
  sirens:0,        // seconds until a distant siren answers a crime
  target:null      // {x,y,label,id} current waypoint
};

/* ---------- input ---------- */
const keys = {};
let pressResolve = null;
addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(k === 'e' || k === ' ' || k === 'enter'){
    e.preventDefault();
    if(pressResolve){ const r = pressResolve; pressResolve = null; r(); }
    else if(S.phase === 'play' && !S.busy) tryInteract();
  }
  if(k === 'r'){ location.reload(); }
  if(k === '1' && S.phase !== 'title') jumpToAct(1);
  if(k === '2' && S.phase !== 'title') jumpToAct(2);
  if(k === '3' && S.phase !== 'title') jumpToAct(3);
});
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

/* ---------- audio (synthesised, no assets) ---------- */
let AC = null, musicTimer = null, droneNode = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq, dur, type, vol, when){
  const ac = audio(); if(!ac) return;
  const t = (when||ac.currentTime);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type||'square'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol||0.12, t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.05);
}
function sfxReward(){
  const ac = audio(); if(!ac) return; const t = ac.currentTime;
  [0,1,2,3].forEach((i)=> tone([660,880,1100,1320][i], 0.18, 'square', 0.09, t+i*0.055));
}
function sfxHit(){ tone(140+Math.random()*60, 0.12, 'sawtooth', 0.14); }
function sfxThud(){ tone(70, 0.3, 'sine', 0.2); }
function sfxSiren(){ tone(720, 0.35, 'sine', 0.05); tone(560, 0.35, 'sine', 0.05, (AC?AC.currentTime+0.35:0)); }
function sfxGlitch(){
  const ac = audio(); if(!ac) return;
  for(let i=0;i<10;i++) tone(120+Math.random()*1400, 0.05, 'square', 0.05, ac.currentTime+i*0.045);
}
function startMusic(){
  stopMusic();
  const notes = [98, 98, 130.8, 110, 98, 98, 146.8, 130.8];
  let i = 0;
  musicTimer = setInterval(()=>{
    tone(notes[i%notes.length], 0.22, 'triangle', 0.05);
    if(i%2===0) tone(notes[i%notes.length]*4, 0.08, 'square', 0.02);
    i++;
  }, 250);
}
function stopMusic(){ if(musicTimer){ clearInterval(musicTimer); musicTimer = null; } }
function startDrone(){
  const ac = audio(); if(!ac || droneNode) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type='sine'; o.frequency.value = 48;
  g.gain.value = 0.05; o.connect(g); g.connect(ac.destination); o.start();
  droneNode = {o,g};
}
function stopDrone(){ if(droneNode){ try{droneNode.o.stop();}catch(e){} droneNode = null; } }
function sfxHeart(){ tone(58,0.16,'sine',0.22); setTimeout(()=>tone(52,0.2,'sine',0.18), 220); }

/* ---------- world geometry ---------- */
const B = (x,y,w,h,o)=> Object.assign({x,y,w,h,roof:'#242743',wall:'#171a2e'}, o||{});
const buildings = [
  B(160,180,300,230,{id:'store', roof:'#2c2140', sign:"MARIA'S", signColor:'#ff2e88', lit:true}),
  B(520,170,180,150,{roof:'#20233c'}),
  B(1000,170,190,170,{roof:'#212540'}),
  B(1270,170,230,170,{roof:'#1e2138', sign:'PAWN', signColor:'#ffb347', lit:true}),
  B(1580,180,220,160,{roof:'#22253f'}),
  B(230,790,260,200,{id:'house', roof:'#2a2440', sign:'', lit:true}),
  B(560,830,190,160,{roof:'#1f2239'}),
  B(1400,830,300,210,{id:'police', roof:'#1b2b45', sign:'POLICE', signColor:'#5ea9ff', lit:true}),
  B(1080,1080,260,140,{roof:'#1e2138'}),
  B(120,1080,300,140,{roof:'#20233a'})
];
const roads = [
  {x:0,y:470,w:WORLD.w,h:150},      // main street
  {x:0,y:1000,w:WORLD.w,h:60},      // lower road
  {x:800,y:0,w:130,h:WORLD.h},      // vertical avenue
  {x:1480,y:0,w:110,h:WORLD.h}
];
const park = {x:880,y:700,w:420,h:250};
const lot  = {x:1500,y:640,w:300,h:290};

/* street furniture — cheap rectangles, but they give the block density */
const props = [
  {t:'dumpster', x:1206, y:392}, {t:'dumpster', x:512, y:452},
  {t:'dumpster', x:1150, y:1050}, {t:'dumpster', x:1720, y:430},
  {t:'bench', x:960, y:760}, {t:'bench', x:1120, y:760}, {t:'bench', x:1040, y:920},
  {t:'bench', x:640, y:470}, {t:'bench', x:1660, y:470},
  {t:'hydrant', x:470, y:472}, {t:'hydrant', x:1340, y:472}, {t:'hydrant', x:760, y:1002},
  {t:'trash', x:700, y:472}, {t:'trash', x:1100, y:472}, {t:'trash', x:300, y:1002},
  {t:'planter', x:180, y:452}, {t:'planter', x:1560, y:452}, {t:'planter', x:900, y:1002},
  {t:'stop', x:1000, y:470}, {t:'stop', x:420, y:1000}
];
const crosswalks = [
  {x:690, y:470, w:60, h:150}, {x:1290, y:470, w:60, h:150},
  {x:420, y:1000, w:60, h:60}, {x:1240, y:1000, w:60, h:60}
];
const lampPosts = [[520,470],[900,470],[1300,470],[1700,470],[400,1000],[1100,1000],[1600,1000],[960,760]];

const markerDefs = {
  store:  {x:310, y:455},
  alley:  {x:1230, y:300},
  car:    {x:1620, y:720},
  escape: {x:180, y:1030},
  offer:  {x:980, y:560},
  final:  {x:400, y:540},
  home:   {x:360, y:1005},
  end:    {x:1080, y:830}
};

/* props */
const parkedCars = [
  {x:1540,y:690,w:46,h:78,c:'#3c4568'},
  {x:1620,y:690,w:46,h:78,c:'#6a3b52', stolen:true},
  {x:1700,y:690,w:46,h:78,c:'#39506b'},
  {x:1540,y:820,w:46,h:78,c:'#4a4560'},
  {x:1700,y:820,w:46,h:78,c:'#43405c'},
  {x:250,y:500,w:46,h:78,c:'#3a4260'},
  {x:1060,y:500,w:46,h:78,c:'#4c3f55'},
  {x:600,y:600,w:46,h:78,c:'#39455e'},
  {x:1400,y:600,w:46,h:78,c:'#46405e'},
  {x:980,y:1030,w:46,h:78,c:'#3d4360'}
];
let policeCars = [];

/* ---------- entities ---------- */
function person(x,y,c,name){ return {x,y,c,name,vx:0,vy:0,t:Math.random()*10,state:'idle',hidden:false,face:1}; }
const P = { x:700, y:545, vx:0, vy:0, r:11, face:1, walk:0 };
const NPC = {
  owner:  person(300, 470, '#ffd9a0', 'Maria'),
  fighter:person(1235, 300, '#c9d2ff', 'Deniz'),
  carOwn: person(1660, 800, '#ffb9d3', 'Sam'),
  kid:    person(330, 1000,'#b7ffd9', 'Ana'),
  cop:    person(1520, 1060,'#9fd0ff', 'Officer')
};
const crowd = [];
/* Pedestrians walk fixed loops. Deterministic routes keep the demo repeatable —
   no random wandering that can strand an NPC inside a wall mid-pitch. */
const ROUTES = [
  [[210,452],[700,452],[700,632],[210,632]],          // west block, both sidewalks
  [[960,452],[1460,452],[1460,632],[960,632]],        // east block
  [[862,240],[862,960],[862,1210]],                   // the avenue, north to south
  [[300,1002],[1000,1002],[1000,1040],[300,1040]],    // lower road
  [[1120,1002],[1760,1002]],                          // lower road east
  [[950,762],[1250,762],[1250,900],[950,900]],        // park loop
  [[700,452],[700,632]],                              // crossing the street
  [[1300,452],[1300,632]]                             // crossing the street
];
const SKIN = ['#8f98c4','#a79ec0','#93a8bd','#bfa9a0','#a3b0d6','#c0a5b4'];
for(let i=0;i<20;i++){
  const rt = ROUTES[i % ROUTES.length];
  const idx = i % rt.length;
  const n = person(rt[idx][0], rt[idx][1], SKIN[i % SKIN.length], '');
  n.route = rt; n.node = (idx+1) % rt.length;
  n.speed = 34 + (i % 5) * 7;
  n.mode = 'walk'; n.timer = (i % 7) * 0.6;
  n.walk = 0;
  crowd.push(n);
}
/* a few people who just stand somewhere — outside the shop, by the park bench */

/* a crime makes the block react — panic, gawking, a siren somewhere else */
function alarm(x, y, kind){

/* ---------- ui helpers ---------- */
const $ = id => document.getElementById(id);
function setHUD(on){ $('hud').classList.toggle('on', !!on); }
const shown = {money:0, xp:0, rep:0};
function refreshHUD(){ $('repbar').style.width = Math.min(100, S.rep) + '%'; }
function tickHUD(dt){
  let dirty = false;
  for(const k of ['money','xp','rep']){
    if(Math.abs(shown[k] - S[k]) > 0.5){
      shown[k] += (S[k] - shown[k]) * Math.min(1, dt * 5.5);
      if(Math.abs(shown[k] - S[k]) < 1) shown[k] = S[k];
      dirty = true;
    } else if(shown[k] !== S[k]){ shown[k] = S[k]; dirty = true; }
  }
  if(!dirty) return;
  $('cash').textContent = '$' + Math.round(shown.money).toLocaleString();
  $('xp').textContent = Math.round(shown.xp);
  $('repn').textContent = Math.round(shown.rep);
  $('repbar').style.width = Math.min(100, shown.rep) + '%';
  $('cash').style.transform = 'scale(' + (1 + Math.min(0.12, Math.abs(S.money - shown.money)/9000)) + ')';
}
function objective(text, tag){ S.objective = text; $('objtxt').textContent = text; $('objtag').textContent = tag||'OBJECTIVE'; }
function banner(k, v){
  $('bk').textContent = k; $('bv').textContent = v;
  const b = $('banner'); b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}
function pop(text, kind){
  const el = document.createElement('div');
  el.className = 'pop ' + (kind||'');
  el.textContent = text;
  $('pops').appendChild(el);
  setTimeout(()=>el.remove(), 1600);
}
function reward({money=0, xp=0, rep=0, silent=false}){
  if(money){ S.money += money; pop('+$' + money.toLocaleString(), silent?'mute':''); }
  if(xp){ S.xp += xp; pop('+' + xp + ' XP', silent?'mute':'xp'); }
  if(rep){ S.rep += rep; pop('+' + rep + ' REP', silent?'mute':'rep'); }
  refreshHUD();
  if(!silent){
    sfxReward();
    S.flash = 0.5;
    burst(P.x, P.y - 6, '#3dff8b', 30, 1.2);
    burst(P.x, P.y - 6, '#ffb347', 12, 0.8);
    cam.zTarget = Math.min(1.5, cam.z + 0.12);
    setTimeout(()=>{ if(!S.focus) cam.zTarget = 1; }, 420);
  }
  S.shake = Math.max(S.shake, silent?2:13);
}
function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }
function keypress(){ return new Promise(r=>{ pressResolve = r; }); }

let dialogueTimer = null;
function say(text, opts){
  opts = opts || {};
  const d = $('dialogue');
  $('dwho').textContent = opts.who || '';
  $('dline').textContent = text;
  d.classList.toggle('quiet', !!opts.quiet);
  d.classList.add('on');

  return new Promise(res=>{
    let done = false;
    const finish = ()=>{ if(done) return; done = true; clearTimeout(dialogueTimer); pressResolve = null; res(); };
    dialogueTimer = setTimeout(finish, ms);
    pressResolve = finish;
  });
}
function hideSay(){ $('dialogue').classList.remove('on'); }

function choices(list){
  const box = $('choices');
  box.innerHTML = '';

/* ---------- particles ---------- */
function burst(x, y, color, n, speed){
  for(let i=0;i<(n||16);i++){
    const a = Math.random()*Math.PI*2, s = (speed||1) * (40 + Math.random()*150);
    particles.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 40, life:0.6+Math.random()*0.5, t:0, c:color, sz:2+Math.random()*3});
  }
}

/* ---------- collision ---------- */
function blocked(x, y, r){
  for(const b of buildings){
    if(x > b.x - r && x < b.x + b.w + r && y > b.y - r && y < b.y + b.h + r) return true;
  }
  return x < r || y < r || x > WORLD.w - r || y > WORLD.h - r;
}
function moveEnt(e, dx, dy, r){
  if(!blocked(e.x + dx, e.y, r)) e.x += dx;
  if(!blocked(e.x, e.y + dy, r)) e.y += dy;
}
const dist = (a,b,x,y)=> Math.hypot(a-x, b-y);

  objective('Mission 01 — the corner store on the west side');
  banner('WELCOME BACK', 'GET PAID');
};
$('againBtn').onclick = ()=> location.reload();

/* ============================================================
   UPDATE
   ============================================================ */
let last = performance.now();
function update(dt){
  S.time += dt;

  // player movement — velocity is eased toward the input, so starts and stops
  // have weight without feeling laggy (reaches full speed in ~0.15s)
  let ix = 0, iy = 0;
  if(S.phase === 'play' && !S.busy){
    if(keys['a'] || keys['arrowleft'])  ix -= 1;
    if(keys['d'] || keys['arrowright']) ix += 1;
    if(keys['w'] || keys['arrowup'])    iy -= 1;
    if(keys['s'] || keys['arrowdown'])  iy += 1;
  }
  const sprinting = !!(keys['shift'] || keys['shiftleft'] || keys['shiftright']) && (ix||iy) && !S.driving;
  S.sprint += ((sprinting ? 1 : 0) - S.sprint) * Math.min(1, dt*6);
  const base = S.driving ? 320 : (S.act === 3 ? 124 : 158);
  const sp = base * (S.driving ? 1 : (1 + S.sprint * 0.62));
  const m = Math.hypot(ix, iy) || 1;
  const tvx = ix/m*sp, tvy = iy/m*sp;
  const ease = (ix||iy) ? 11 : 13;             // decelerate a touch faster than accelerate
  P.vx += (tvx - P.vx) * Math.min(1, dt*ease);
  P.vy += (tvy - P.vy) * Math.min(1, dt*ease);
  if(Math.abs(P.vx) < 2 && Math.abs(P.vy) < 2 && !ix && !iy){ P.vx = 0; P.vy = 0; }
  if(Math.abs(P.vx) > 6) P.face = P.vx > 0 ? 1 : -1;
  moveEnt(P, P.vx*dt, P.vy*dt, S.driving ? 20 : P.r);
  const speed = Math.hypot(P.vx, P.vy);
  P.walk += speed * dt * (S.driving ? 0 : 0.085);
  // footstep taps + sprint dust
  if(!S.driving && speed > 30){
    P.step = (P.step || 0) + speed * dt * 0.012;
    if(P.step > 1){
      P.step = 0;
      tone(90 + Math.random()*30, 0.05, 'triangle', 0.02 + S.sprint*0.02);
      if(S.sprint > 0.4) particles.push({x:P.x - P.vx*0.04, y:P.y + 11, vx:-P.vx*0.12, vy:-14,
                                         life:0.4, t:0, c:'#39406a', sz:3});
    }
  }
  if(S.driving && speed > 40 && Math.random() < 0.4)
    particles.push({x:P.x,y:P.y,vx:-P.vx*0.2,vy:-P.vy*0.2,life:0.4,t:0,c:'#4a5170',sz:3});

  // camera — leads the player slightly, pulls back when sprinting,
  // pushes in on whatever the current interaction is looking at
  const lead = S.driving ? 0.38 : 0.22;
  let tx2 = P.x + P.vx*lead, ty2 = P.y + P.vy*lead;
  let follow = 4.5;
  if(S.focus){ tx2 = (S.focus.x + P.x)/2; ty2 = (S.focus.y + P.y)/2; follow = 3.2; }
  if(!S.focus) cam.zTarget = 1 - S.sprint*0.05 - (S.driving?0.06:0);
  cam.z += (cam.zTarget - cam.z) * Math.min(1, dt*3.4);
  cam.x += (tx2 - cam.x) * Math.min(1, dt*follow);
  cam.y += (ty2 - cam.y) * Math.min(1, dt*follow);
  const hw = VW/(2*cam.z), hh = VH/(2*cam.z);
  cam.x = Math.max(hw, Math.min(WORLD.w - hw, cam.x));
  cam.y = Math.max(hh, Math.min(WORLD.h - hh, cam.y));
  if(S.sprint > 0.5) S.shake = Math.max(S.shake, 1.6);
  // a siren answers a crime a beat later, from somewhere you can't see
  if(S.sirens > 0){ S.sirens -= dt; if(S.sirens <= 0){ sfxSiren(); S.sirens = 0; } }

  // idle patrol car
  for(const pc of policeCars){
    if(!pc.patrol) continue;
    pc.dir = pc.dir || -1;
    pc.x += pc.dir * 70 * dt;
    if(pc.x < 250 || pc.x > 1700) pc.dir *= -1;
    if(Math.random() < dt*0.25) sfxSiren();
  }

  // chase
  if(S.chase){
    for(const pc of policeCars){
      const a = Math.atan2(P.y - pc.y, P.x - pc.x);
      pc.x += Math.cos(a) * 240 * dt;
      pc.y += Math.sin(a) * 240 * dt;
    }
    if(Math.random() < dt*1.2) sfxSiren();
  }

  // pedestrians: walk the loop, pause at corners, scatter from crimes,
  // gawk at an assault, and after the reveal, get out of your way
  for(const c of crowd){
    c.timer -= dt;
    let vx = 0, vy = 0;

    if(c.mode === 'flee'){
      const a = Math.atan2(c.y - c.gy, c.x - c.gx);
      vx = Math.cos(a) * 128; vy = Math.sin(a) * 128;
      if(c.timer <= 0) c.mode = c.route ? 'walk' : 'stand';
    } else if(c.mode === 'gather'){
      const d = dist(c.x, c.y, c.gx, c.gy);
      if(d > 74){ const a = Math.atan2(c.gy - c.y, c.gx - c.x); vx = Math.cos(a)*62; vy = Math.sin(a)*62; }
      if(c.timer <= 0) c.mode = c.route ? 'walk' : 'stand';
    } else if(c.mode === 'pause'){
      if(c.timer <= 0){ c.mode = 'walk'; }
    } else if(c.mode === 'stand'){
      const a = c.anchor || {x:c.x, y:c.y};
      const d = dist(c.x, c.y, a.x, a.y);
      if(d > 6){ const ang = Math.atan2(a.y - c.y, a.x - c.x); vx = Math.cos(ang)*40; vy = Math.sin(ang)*40; }
      else if(c.timer <= 0){ c.timer = 3 + (c.speed % 4); c.face *= -1; }
    } else if(c.route){
      const t = c.route[c.node];
      const d = dist(c.x, c.y, t[0], t[1]);
      if(d < 10){
        c.node = (c.node + 1) % c.route.length;
        if((c.node % 2) === 0){ c.mode = 'pause'; c.timer = 0.7 + (c.speed % 3) * 0.4; }
      } else {
        const a = Math.atan2(t[1] - c.y, t[0] - c.x);
        vx = Math.cos(a) * c.speed; vy = Math.sin(a) * c.speed;
      }
    }

    // after the reveal, people give the protagonist room
    if(S.act === 3 && c.mode !== 'flee'){
      const d = dist(c.x, c.y, P.x, P.y);
      if(d < 140){
        const a = Math.atan2(c.y - P.y, c.x - P.x);
        vx = Math.cos(a)*64; vy = Math.sin(a)*64;
        c.avoiding = 1;
      } else c.avoiding = Math.max(0, (c.avoiding||0) - dt);
    }

    if(vx) c.face = vx > 0 ? 1 : -1;
    c.walk = (c.walk || 0) + Math.hypot(vx,vy) * dt * 0.09;
    moveEnt(c, vx*dt, vy*dt, 9);
  }

  // searching car owner paces
  if(NPC.carOwn.state === 'search'){
    NPC.carOwn.x = 1600 + Math.sin(S.time*0.9) * 55;
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.t += dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 260*dt;
    if(p.t > p.life) particles.splice(i,1);
  }

  // rain
  if(S.rain > 0){
    for(const d of rainDrops){
      d.y += (520 + d.s*60) * dt;
      d.x -= 120*dt;
      if(d.y > VH){ d.y = -20; d.x = Math.random()*VW + 120; }
      if(d.x < -30) d.x = VW + 20;
    }
  }

  if(S.shake > 0) S.shake = Math.max(0, S.shake - dt*40);
  if(S.flash > 0) S.flash = Math.max(0, S.flash - dt*1.8);

  // interaction prompt
  if(S.phase === 'play' && !S.busy){
    const near = interactables().filter(i => dist(P.x,P.y,i.x,i.y) < 62)[0];
    if(near){ $('promptText').textContent = near.label; $('prompt').classList.add('on'); }
    else hidePrompt();
  } else hidePrompt();

  // occasional heartbeat after the reveal
  if(S.act === 3 && Math.random() < dt*0.25) sfxHeart();
}

/* ============================================================
   DRAW
   ============================================================ */
function draw(){
  const sx = (Math.random()-0.5) * S.shake;
  const sy = (Math.random()-0.5) * S.shake;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = '#07080f';
  ctx.fillRect(0,0,VW,VH);
  ctx.save();
  ctx.translate(VW/2 + sx, VH/2 + sy);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-cam.x, -cam.y);

  // ground
  ctx.fillStyle = '#0d0f1c';
  ctx.fillRect(0,0,WORLD.w,WORLD.h);

  // roads
  for(const r of roads){
    ctx.fillStyle = '#181a2b';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = 'rgba(255,255,255,.07)';
    if(r.w > r.h){
      for(let x = r.x+20; x < r.x+r.w; x += 70) ctx.fillRect(x, r.y + r.h/2 - 2, 36, 4);
    } else {
      for(let y = r.y+20; y < r.y+r.h; y += 70) ctx.fillRect(r.x + r.w/2 - 2, y, 4, 36);
    }
  }

  // park
  ctx.fillStyle = S.act === 1 ? '#15291f' : '#131c19';
  ctx.fillRect(park.x, park.y, park.w, park.h);
  ctx.fillStyle = S.act === 1 ? '#1d3a2a' : '#17251d';
  for(let i=0;i<7;i++){
    const tx = park.x + 40 + (i*57)%(park.w-70), ty = park.y + 40 + (i*93)%(park.h-70);
    ctx.beginPath(); ctx.arc(tx, ty, 22, 0, 7); ctx.fill();
  }

  // parking lot
  ctx.fillStyle = '#151726';
  ctx.fillRect(lot.x, lot.y, lot.w, lot.h);
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2;
  for(let x = lot.x+30; x < lot.x+lot.w; x += 80){
    ctx.beginPath(); ctx.moveTo(x, lot.y+10); ctx.lineTo(x, lot.y+100); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, lot.y+150); ctx.lineTo(x, lot.y+240); ctx.stroke();
  }

  // crosswalks
  ctx.fillStyle = 'rgba(232,233,243,.13)';
  for(const cw of crosswalks){
    for(let i = 0; i < cw.h; i += 18) ctx.fillRect(cw.x, cw.y + i, cw.w, 9);
  }

  // street lamps pools
  for(const [lx,ly] of lampPosts){
    const g = ctx.createRadialGradient(lx, ly, 4, lx, ly, 150);
    const warm = S.act === 3 ? 'rgba(255,179,71,.10)' : 'rgba(255,200,120,.16)';
    g.addColorStop(0, warm); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(lx, ly, 150, 0, 7); ctx.fill();
  }

  // street furniture
  drawProps();

  // parked cars
  for(const c of parkedCars){
    if(c.stolen && S.flags.carStolen) continue;
    drawCar(c.x, c.y, c.c);
  }
  if(S.flags.carStolen && S.act >= 2){
    ctx.strokeStyle = 'rgba(255,46,136,.5)'; ctx.setLineDash([8,8]); ctx.lineWidth = 2;
    ctx.strokeRect(1620-23, 690-39, 46, 78); ctx.setLineDash([]);
  }

  // police cars
  for(const pc of policeCars) drawCar(pc.x, pc.y, '#22304d', true);

  // ambulance in act 2/3
  if(S.flags.npcInjured && S.act >= 2){
    ctx.fillStyle = '#e8e9f3'; ctx.fillRect(1196, 380, 60, 100);
    ctx.fillStyle = '#ff4d4d'; ctx.fillRect(1216, 415, 20, 6); ctx.fillRect(1223, 408, 6, 20);
    const blink = Math.sin(S.time*7) > 0;
    ctx.fillStyle = blink ? '#ff4d4d' : '#3b6cff';
    ctx.fillRect(1208, 372, 36, 8);
    const g = ctx.createRadialGradient(1226, 376, 2, 1226, 376, 120);
    g.addColorStop(0, blink ? 'rgba(255,77,77,.25)' : 'rgba(59,108,255,.25)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(1226, 376, 120, 0, 7); ctx.fill();
  }

  // buildings
  for(const b of buildings) drawBuilding(b);

  // markers
  for(const it of interactables()) drawMarker(it.x, it.y);

  // people
  const people = crowd.concat([NPC.owner, NPC.fighter, NPC.carOwn, NPC.kid, NPC.cop]);
  people.sort((a,b)=>a.y-b.y);
  for(const n of people){
    if(n.hidden) continue;
    if(n === NPC.fighter && n.state === 'down'){ drawDown(n); continue; }
    if(n === NPC.owner && S.act >= 2){ drawPerson(n, true); continue; }
    if(n === NPC.cop && S.act === 1) continue;
    drawPerson(n);
  }

  // player
  if(S.driving) drawCar(P.x, P.y, '#6a3b52');
  else drawPlayer();

  // particles
  for(const p of particles){
    ctx.globalAlpha = Math.max(0, 1 - p.t/p.life);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.sz/2, p.y - p.sz/2, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // ---- screen-space overlays ----
  // payout flash
  if(S.flash > 0){
    ctx.fillStyle = 'rgba(61,255,139,' + (S.flash*0.14) + ')';
    ctx.fillRect(0,0,VW,VH);
  }
  // cool darkening after the reveal
  if(S.dark > 0){
    ctx.fillStyle = 'rgba(10,16,40,' + (S.dark*0.55) + ')';
    ctx.fillRect(0,0,VW,VH);
  }
  // rain
  if(S.rain > 0){
    ctx.strokeStyle = 'rgba(190,205,255,' + (0.18 * S.rain) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(const d of rainDrops){ ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 4, d.y + d.l); }
    ctx.stroke();
  }
  // off-screen objective arrow
  const it = interactables()[0];
  if(it && S.phase === 'play' && !S.busy) drawArrow(it);
}

function drawBuilding(b){
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(b.x + 8, b.y + 12, b.w, b.h);
  ctx.fillStyle = b.wall;
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = b.roof;
  ctx.fillRect(b.x + 6, b.y + 6, b.w - 12, b.h - 12);

  // windows
  const dead = (b.id === 'store' && S.flags.robbedStore && S.act >= 2);
  for(let y = b.y + 18; y < b.y + b.h - 26; y += 34){
    for(let x = b.x + 18; x < b.x + b.w - 26; x += 34){
      const on = ((x*31 + y*17) % 7) > (S.act === 3 ? 4 : 2);
      ctx.fillStyle = dead ? '#0f1120' : (on ? (S.act === 3 ? 'rgba(255,196,120,.35)' : 'rgba(255,214,150,.55)') : '#12142a');
      ctx.fillRect(x, y, 16, 12);
    }
  }
  // neon sign
  if(b.sign){
    const dim = dead;
    ctx.save();
    ctx.globalAlpha = dim ? 0.18 : 1;
    ctx.fillStyle = dim ? '#4a4f70' : b.signColor;
    ctx.font = '700 18px "Anton", sans-serif';
    ctx.textAlign = 'center';
    if(!dim){ ctx.shadowColor = b.signColor; ctx.shadowBlur = 18; }
    ctx.fillText(b.sign, b.x + b.w/2, b.y + b.h + 22);
    ctx.restore();
  }
  // closed notice
  if(dead){
    ctx.save();
    ctx.fillStyle = '#e8e9f3';
    ctx.fillRect(b.x + b.w/2 - 34, b.y + b.h - 18, 68, 26);
    ctx.fillStyle = '#0a0b14';
    ctx.font = '700 15px "Anton", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('CLOSED', b.x + b.w/2, b.y + b.h + 1);
    ctx.restore();
  }
}

function drawProps(){
  const shade = S.act === 3 ? 0.65 : 1;
  for(const p of props){
    ctx.fillStyle = 'rgba(0,0,0,.4)';
    if(p.t === 'dumpster'){
      ctx.fillRect(p.x - 20, p.y - 6, 46, 26);
      ctx.fillStyle = '#2a4438'; ctx.fillRect(p.x - 24, p.y - 16, 46, 26);
      ctx.fillStyle = '#35533f'; ctx.fillRect(p.x - 24, p.y - 16, 46, 7);
    } else if(p.t === 'bench'){
      ctx.fillRect(p.x - 20, p.y - 2, 44, 12);
      ctx.fillStyle = '#4a3b2e'; ctx.fillRect(p.x - 22, p.y - 8, 44, 12);
      ctx.fillStyle = '#5c4a39'; ctx.fillRect(p.x - 22, p.y - 14, 44, 5);
    } else if(p.t === 'hydrant'){
      ctx.fillRect(p.x - 4, p.y + 2, 12, 6);
      ctx.fillStyle = '#8c3448'; ctx.fillRect(p.x - 5, p.y - 12, 10, 16);
      ctx.fillRect(p.x - 8, p.y - 8, 16, 4);
    } else if(p.t === 'trash'){
      ctx.fillRect(p.x - 8, p.y + 2, 20, 7);
      ctx.fillStyle = '#31344f'; ctx.fillRect(p.x - 9, p.y - 12, 18, 16);
      ctx.fillStyle = '#3c4060'; ctx.fillRect(p.x - 11, p.y - 14, 22, 4);
    } else if(p.t === 'planter'){
      ctx.fillRect(p.x - 12, p.y - 2, 28, 12);
      ctx.fillStyle = '#3a3550'; ctx.fillRect(p.x - 14, p.y - 10, 28, 14);
      ctx.fillStyle = S.act === 1 ? '#2f6a45' : '#2a4535';
      ctx.beginPath(); ctx.arc(p.x, p.y - 16, 11, 0, 7); ctx.fill();
    } else if(p.t === 'stop'){
      ctx.fillRect(p.x - 3, p.y - 2, 10, 6);
      ctx.fillStyle = '#2b2f4d'; ctx.fillRect(p.x - 3, p.y - 52, 5, 52);
      ctx.fillStyle = shade > 0.8 ? '#ffb347' : '#6b6650';
      ctx.fillRect(p.x - 16, p.y - 62, 34, 14);
    }
  }
  // lamp posts, drawn after the light pools so the pole reads on top
  for(const [lx,ly] of lampPosts){
    ctx.fillStyle = '#20233c';
    ctx.fillRect(lx - 3, ly - 44, 6, 44);
    ctx.fillStyle = S.act === 3 ? 'rgba(255,179,71,.55)' : 'rgba(255,214,150,.9)';
    ctx.fillRect(lx - 9, ly - 52, 18, 9);
  }
}

function drawCar(x, y, color, police){
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.fillRect(x - 21, y - 34, 46, 78);
  ctx.fillStyle = color;
  ctx.fillRect(x - 23, y - 39, 46, 78);
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  ctx.fillRect(x - 17, y - 28, 34, 22);
  ctx.fillRect(x - 17, y + 6, 34, 20);
  if(police){
    const blink = Math.sin(S.time*10) > 0;
    ctx.fillStyle = blink ? '#ff4d4d' : '#3b6cff';
    ctx.fillRect(x - 16, y - 4, 32, 7);
    const g = ctx.createRadialGradient(x, y, 2, x, y, 110);
    g.addColorStop(0, blink ? 'rgba(255,77,77,.22)' : 'rgba(59,108,255,.22)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 110, 0, 7); ctx.fill();
  }
}

function drawPerson(n, sitting){
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.ellipse(n.x, n.y + 12, 11, 5, 0, 0, 7); ctx.fill();
  if(sitting){
    ctx.fillStyle = n.c;
    ctx.fillRect(n.x - 9, n.y - 6, 18, 18);
    ctx.beginPath(); ctx.arc(n.x, n.y - 13, 7, 0, 7); ctx.fill();
    return;
  }
  const bob = Math.sin((n.walk || 0) * 6) * 1.5;
  const lean = n.mode === 'flee' ? (n.face || 1) * 2.5 : 0;
  ctx.fillStyle = n.c;
  ctx.fillRect(n.x - 8 + lean, n.y - 14 + bob, 16, 24);
  ctx.beginPath(); ctx.arc(n.x + lean, n.y - 20 + bob, 7.5, 0, 7); ctx.fill();
  if(n.mode === 'flee'){
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.font = '700 15px "Anton", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('!', n.x, n.y - 32 + bob);
  } else if(S.act === 3 && n.avoiding > 0){
    ctx.fillStyle = 'rgba(200,210,245,.45)';
    ctx.beginPath(); ctx.arc(n.x, n.y - 34, 2.5, 0, 7); ctx.fill();
  }
}

function drawDown(n){
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.ellipse(n.x, n.y + 8, 18, 7, 0, 0, 7); ctx.fill();
  ctx.fillStyle = n.c;
  ctx.fillRect(n.x - 18, n.y - 4, 36, 14);
  ctx.beginPath(); ctx.arc(n.x - 22, n.y + 3, 7, 0, 7); ctx.fill();
}

function drawPlayer(){
  const spd = Math.hypot(P.vx, P.vy);
  // grounding ring — the one silhouette the eye should always find
  ctx.strokeStyle = S.act === 3 ? 'rgba(160,172,215,.35)' : 'rgba(255,46,136,.45)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(P.x, P.y + 14, 15, 6.5, 0, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.beginPath(); ctx.ellipse(P.x, P.y + 13, 12, 5, 0, 0, 7); ctx.fill();

  const bob = Math.sin(P.walk * 6) * (1.4 + S.sprint);
  const lean = P.face * S.sprint * 3;
  ctx.save();
  ctx.translate(lean, 0);
  // body
  ctx.fillStyle = S.act === 3 ? '#cfd4ee' : '#f6f7ff';
  ctx.fillRect(P.x - 9, P.y - 17 + bob, 18, 28);
  ctx.strokeStyle = 'rgba(8,9,17,.85)'; ctx.lineWidth = 2;
  ctx.strokeRect(P.x - 9, P.y - 17 + bob, 18, 28);
  // jacket band
  ctx.fillStyle = S.act === 3 ? '#2a2f4d' : '#ff2e88';
  ctx.fillRect(P.x - 9, P.y - 5 + bob, 18, 7);
  // legs
  const swing = Math.sin(P.walk * 6) * Math.min(5, spd * 0.03);
  ctx.fillStyle = '#20233c';
  ctx.fillRect(P.x - 8, P.y + 9 + bob, 6, 5 + swing);
  ctx.fillRect(P.x + 2, P.y + 9 + bob, 6, 5 - swing);
  // head
  ctx.fillStyle = '#ffe1c4';
  ctx.beginPath(); ctx.arc(P.x + P.face*1.5, P.y - 24 + bob, 8, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(8,9,17,.7)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(P.x + P.face*1.5, P.y - 24 + bob, 8, 0, 7); ctx.stroke();
  ctx.restore();
}

function drawMarker(x, y){
  const t = (S.time*2) % 1;
  const col = S.act === 1 ? '61,255,139' : (S.act === 2 ? '255,179,71' : '232,233,243');
  ctx.strokeStyle = 'rgba(' + col + ',' + (0.9 - t*0.9) + ')';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(x, y, 16 + t*32, 8 + t*16, 0, 0, 7); ctx.stroke();
  const g = ctx.createLinearGradient(x, y - 90, x, y);
  g.addColorStop(0, 'rgba(' + col + ',0)');
  g.addColorStop(1, 'rgba(' + col + ',.28)');
  ctx.fillStyle = g;
  ctx.fillRect(x - 11, y - 90, 22, 90);
}

function drawArrow(it){
  const dx = (it.x - cam.x) * cam.z, dy = (it.y - cam.y) * cam.z;
  if(Math.abs(dx) < VW/2 - 60 && Math.abs(dy) < VH/2 - 60) return;
  const a = Math.atan2(dy, dx);
  const r = 210;
  const ax = VW/2 + Math.cos(a)*r, ay = VH/2 + Math.sin(a)*r;
  ctx.save();
  ctx.translate(ax, ay); ctx.rotate(a);
  ctx.fillStyle = S.act === 1 ? '#3dff8b' : '#e8e9f3';
  ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.moveTo(14,0); ctx.lineTo(-10,9); ctx.lineTo(-10,-9); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- loop ---------- */
function loop(now){
  const raw = Math.min(0.05, (now - last)/1000);
  last = now;
  update(raw * S.timeScale);
  tickHUD(raw);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
